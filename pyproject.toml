[project]
name = "roadrisk-london"
version = "0.1.0"
description = "Data-first Streamlit and scikit-learn road-safety risk app for London."
requires-python = ">=3.11"
dependencies = [
    "geopandas>=0.14",
    "joblib>=1.3",
    "kmodes>=0.12.2",
    "matplotlib>=3.11.0",
    "osmnx>=2.0",
    "pandas>=2.2",
    "plotly>=5.22",
    "pyarrow>=15",
    "pydeck>=0.9",
    "pytest>=8",
    "ruff>=0.5",
    "scikit-learn>=1.4",
    "streamlit>=1.36",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
